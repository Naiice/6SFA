<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5S Dashboard – 13 Lines</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#dde3ea;--ac:#0f6cbd;
--A:#1e8e4e;--B:#5aa02c;--C:#e0a100;--D:#d64545;--Ab:#dff3e7;--Bb:#e9f4dc;--Cb:#fdf1cc;--Db:#fbe1e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e6ecf2;--mu:#94a1af;--bd:#2c3744;--ac:#4aa3f0;--Ab:#14382394;--Bb:#25381594;--Cb:#40320a94;--Db:#451c1c94}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e6ecf2;--mu:#94a1af;--bd:#2c3744;--ac:#4aa3f0;--Ab:#14382394;--Bb:#25381594;--Cb:#40320a94;--Db:#451c1c94}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
header{padding:16px 16px 0;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
nav button,select,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:0 16px 32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}td:first-child,th:first-child,td.l,th.l{text-align:left}
tbody tr.go{cursor:pointer}tbody tr.go:hover{background:var(--bg)}
.chip{display:inline-block;min-width:54px;padding:2px 8px;border-radius:6px;font-weight:600}
.A{background:var(--Ab);color:var(--A)}.B{background:var(--Bb);color:var(--B)}.C{background:var(--Cb);color:var(--C)}.D{background:var(--Db);color:var(--D)}
.lv{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;font-size:12px;font-weight:700;text-align:center;margin-right:4px}
.lv.A{background:var(--A);color:#fff}.lv.B{background:var(--B);color:#fff}.lv.C{background:var(--C);color:#fff}.lv.D{background:var(--D);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.zh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.big{font-size:28px;font-weight:700;line-height:1}
.row{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--bd);position:relative;overflow:hidden}.bar i{display:block;height:100%}
.row input{width:58px;font:inherit;padding:3px 4px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);text-align:right}
.mu{color:var(--mu);font-size:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;font-size:12px;color:var(--mu)}
h2{font-size:15px;margin:18px 0 8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.fill-A{background:var(--A)}.fill-B{background:var(--B)}.fill-C{background:var(--C)}.fill-D{background:var(--D)}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:4px}
.st-open{background:var(--Db);color:var(--D)}.st-replied{background:var(--Cb);color:var(--C)}.st-closed{background:var(--Ab);color:var(--A)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.fm label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
textarea,.fm input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.iss{border-left:4px solid var(--bd);margin-top:10px}.iss.open{border-left-color:var(--D)}.iss.replied{border-left-color:var(--C)}.iss.closed{border-left-color:var(--A)}
.ib{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.ph{max-width:200px;max-height:150px;border-radius:8px;margin-top:6px;cursor:zoom-in;display:block}.btn:disabled{opacity:.45;cursor:not-allowed}</style></head><body>
<header><h1>5S Dashboard · โรงงาน 13 ไลน์</h1>
<div class="sub">1 ไลน์ = 1 Supervisor + 4 Team Leader (หัวไลน์ · กลางไลน์ · Cooling · ท้ายไลน์) · เป้าหมาย ≥ 85% · <span id="mode">💾 เก็บในเครื่องนี้</span> · <button class="btn" id="syb" onclick="toggleSync()" style="padding:2px 10px;font-size:12px">เปิดซิงก์ Google Sheet</button> <button class="btn" id="syf" onclick="permFix()" style="padding:2px 10px;font-size:12px;display:none">จัดการสิทธิ์</button> <span id="sy" class="mu"></span></div>
<nav id="nav"></nav></header>
<main id="m"></main>
<script>
const Z=['หัวไลน์','กลางไลน์','Cooling','ท้ายไลน์'];
const S=['1S คัดแยก','2S จัดวาง','3S ทำความสะอาด','4S มาตรฐาน','5S วินัย'];
const TARGET=85,N=13;
const names=['สมชาย','สมศักดิ์','วิชัย','ประยุทธ','สุรชัย','อนุชา','นิพนธ์','ธนากร','พงศกร','กิตติ','วรวุฒิ','อภิชาติ','ชัยวัฒน์','มานะ','ปรีชา','สุเทพ','เกรียงไกร','ธีรพงษ์','ณัฐพล','ศุภชัย','จักรพันธ์','บุญเลิศ','สมหมาย','ศักดา','วีระ','ประสิทธิ์','ทวี','อนันต์','สุรินทร์','เอกชัย','ภานุ','คมสัน','รัฐพล','ดนัย','ชาญยุทธ','พิสิษฐ์','นพดล','สิทธิพร','วุฒิชัย','ไพโรจน์','ธวัช','อดิศักดิ์','กฤษดา','สมบัติ','ปิยะ','วรพจน์','ชลิต','สันติ','ยุทธนา','เฉลิม','บัณฑิต','ณรงค์','อำนาจ','ธนพล'];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
let D=[];for(let l=0;l<N;l++){const base=70+rnd()*22;D.push({sup:'คุณ'+names[l],tl:Z.map((_,z)=>'คุณ'+names[13+l*4+z]),s:Z.map(()=>S.map(()=>Math.round(Math.min(100,Math.max(50,base+(rnd()-.5)*20)))))})}
try{const x=JSON.parse(localStorage.getItem('s5v1'));if(x&&x.length==N)D=x}catch(e){}
let DB=null,ME='';
const wf=e=>{console.error(e);alert('บันทึกขึ้นระบบกลางไม่สำเร็จ: '+((e&&(e.message||e.code))||'ไม่ทราบสาเหตุ')+'\n(ตรวจสอบว่าบัญชีของคุณมีสิทธิ์ Contributor ขึ้นไป หรือรูปมีขนาดใหญ่เกินไป)')};
const save=l=>{schedPush();if(DB){if(l!=null)DB.doc('lines/l'+l).set({json:JSON.stringify(D[l])}).catch(wf);return}try{localStorage.setItem('s5v1',JSON.stringify(D))}catch(e){}};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const zp=(l,z)=>avg(D[l].s[z]);
const lp=l=>avg(Z.map((_,z)=>zp(l,z)));
const lvl=p=>p>=90?['A','ดีเยี่ยม']:p>=80?['B','ดี']:p>=70?['C','พอใช้']:['D','ต้องปรับปรุง'];
const f=p=>p.toFixed(1)+'%';
const chip=p=>`<span class="chip ${lvl(p)[0]}">${f(p)}</span>`;
const lb=p=>{const v=lvl(p);return `<span class="lv ${v[0]}">${v[0]}</span>${v[1]}`};
const ln=l=>'Line '+String(l+1).padStart(2,'0');
let tab='ov',cur=0;
const tabs={ov:'ภาพรวม',dt:'รายละเอียด/บันทึกคะแนน',rk:'ประเมิน Sup & TL',iss:'Issue จาก Audit',sh:'Export / Import Sheet'};
function nav(){document.getElementById('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('')}
function legend(){return `<div class="legend"><span><span class="lv A">A</span>≥90% ดีเยี่ยม</span><span><span class="lv B">B</span>80–89.9% ดี</span><span><span class="lv C">C</span>70–79.9% พอใช้</span><span><span class="lv D">D</span>&lt;70% ต้องปรับปรุง</span></div>`}
function ov(){
const lp_=D.map((_,l)=>lp(l)),all=avg(lp_),mx=lp_.indexOf(Math.max(...lp_)),mn=lp_.indexOf(Math.min(...lp_));
const zavg=Z.map((_,z)=>avg(D.map((_,l)=>zp(l,z))));
const below=lp_.filter(p=>p<TARGET).length;
return `<div class="kpis">
<div class="card kpi"><span>คะแนน 5S รวมโรงงาน</span><b>${f(all)}</b>${lb(all)}</div>
<div class="card kpi"><span>ไลน์ที่ดีที่สุด</span><b>${ln(mx)}</b><span>${f(lp_[mx])}</span></div>
<div class="card kpi"><span>ไลน์ที่ต้องเร่งปรับปรุง</span><b>${ln(mn)}</b><span>${f(lp_[mn])}</span></div>
<div class="card kpi"><span>ไลน์ต่ำกว่าเป้า (${TARGET}%)</span><b>${below} / ${N}</b></div></div>
<div class="card sc"><table><thead><tr><th>ไลน์</th><th class="l">Supervisor</th>${Z.map(z=>`<th>${z}</th>`).join('')}<th>รวมไลน์</th><th class="l">ระดับ Sup</th></tr></thead><tbody>
${D.map((d,l)=>`<tr class="go" onclick="cur=${l};tab='dt';draw()"><td><b>${ln(l)}</b></td><td class="l">${d.sup}</td>${Z.map((_,z)=>`<td>${chip(zp(l,z))}</td>`).join('')}<td>${chip(lp_[l])}</td><td class="l">${lb(lp_[l])}</td></tr>`).join('')}
</tbody><tfoot><tr><td colspan="2" class="l"><b>เฉลี่ยทุกไลน์</b></td>${zavg.map(p=>`<td>${chip(p)}</td>`).join('')}<td>${chip(all)}</td><td></td></tr></tfoot></table></div>
${legend()}<div class="mu">คลิกที่แถวเพื่อดูรายละเอียดและบันทึกคะแนนของไลน์นั้น</div>`}
function dt(){
const d=D[cur],p=lp(cur);
return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
<select onchange="cur=+this.value;draw()">${D.map((_,l)=>`<option value="${l}" ${l==cur?'selected':''}>${ln(l)}</option>`).join('')}</select>
<div class="card" style="flex:1;min-width:240px;display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="mu">Supervisor</div><b>${d.sup}</b><div>${lb(p)}</div></div><div class="big">${f(p)}</div></div></div>
<div class="grid">${Z.map((z,zi)=>{const q=zp(cur,zi),v=lvl(q)[0];return `<div class="card"><div class="zh"><div><b>${z}</b><div class="mu">Team Leader: ${d.tl[zi]}</div><div class="mu">Issue ปิดแล้ว ${ist(cur,zi).c}/${ist(cur,zi).t}</div><div>${lb(q)}</div></div><div class="big">${f(q)}</div></div>
${S.map((s,si)=>{const x=d.s[zi][si];return `<div class="row"><span>${s}</span><div class="bar"><i class="fill-${lvl(x)[0]}" style="width:${x}%"></i></div><input type="number" min="0" max="100" value="${x}" onchange="setv(${zi},${si},this.value)"></div>`}).join('')}</div>`}).join('')}</div>
${legend()}<div class="mu">แก้ตัวเลขคะแนน (% ต่อหัวข้อ 5S) ระบบคำนวณ % พื้นที่ → TL → Sup ให้อัตโนมัติ</div>`}
function setv(z,s,v){D[cur].s[z][s]=Math.max(0,Math.min(100,+v||0));save(cur);draw()}
function rk(){
const tl=[];D.forEach((d,l)=>Z.forEach((z,zi)=>tl.push({l,z,zi,n:d.tl[zi],p:zp(l,zi)})));
tl.sort((a,b)=>b.p-a.p);
const sp=D.map((d,l)=>({l,n:d.sup,p:lp(l)})).sort((a,b)=>b.p-a.p);
return `<div class="two"><div><h2>ประเมิน Supervisor (เฉลี่ยทั้ง 4 พื้นที่)</h2><div class="card sc"><table><thead><tr><th>#</th><th class="l">ชื่อ</th><th>ไลน์</th><th>%</th><th class="l">ระดับ</th></tr></thead><tbody>
${sp.map((r,i)=>`<tr><td>${i+1}</td><td class="l">${r.n}</td><td>${ln(r.l)}</td><td>${chip(r.p)}</td><td class="l">${lb(r.p)}</td></tr>`).join('')}</tbody></table></div></div>
<div><h2>ประเมิน Team Leader (52 คน)</h2><div class="card sc" style="max-height:640px;overflow:auto"><table><thead><tr><th>#</th><th class="l">ชื่อ</th><th>ไลน์</th><th>พื้นที่</th><th>%</th><th class="l">ระดับ</th></tr></thead><tbody>
${tl.map((r,i)=>`<tr><td>${i+1}</td><td class="l">${r.n}</td><td>${ln(r.l)}</td><td>${r.z}</td><td>${chip(r.p)}</td><td class="l">${lb(r.p)}</td></tr>`).join('')}</tbody></table></div></div></div>${legend()}`}

const todayS=()=>new Date().toISOString().slice(0,10),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ISS=[{id:1,l:0,z:0,s:2,sev:'สูง',desc:'พบคราบน้ำมันรั่วใต้เครื่อง Filler',auditor:'QA Audit',date:addD(-5),due:addD(-1),st:'open',reply:''},
{id:2,l:0,z:2,s:1,sev:'กลาง',desc:'อุปกรณ์ Cooling วางไม่เป็นที่ ไม่มีป้ายระบุตำแหน่ง',auditor:'QA Audit',date:addD(-3),due:addD(4),st:'replied',reply:'ทำ shadow board และติดป้ายแล้ว รอ Audit ตรวจ'},
{id:3,l:1,z:1,s:0,sev:'ต่ำ',desc:'มีของไม่ใช้งานวางข้างสายพาน',auditor:'Plant Mgr',date:addD(-9),due:addD(-2),st:'closed',reply:'นำออกและย้ายไปพื้นที่เก็บแล้ว'},
{id:4,l:2,z:3,s:3,sev:'กลาง',desc:'ไม่มี Visual standard ที่จุด Packing ท้ายไลน์',auditor:'QA Audit',date:addD(-1),due:addD(6),st:'open',reply:''},
{id:5,l:1,z:0,s:4,sev:'สูง',desc:'พนักงานไม่ใช้ PPE ตามมาตรฐาน',auditor:'Safety',date:addD(-7),due:addD(-3),st:'closed',reply:'อบรมซ้ำและติดตามหน้างานทุกกะ'}];
try{const x=JSON.parse(localStorage.getItem('s5iss1'));if(Array.isArray(x))ISS=x}catch(e){}
const saveI=i=>{schedPush();if(DB){if(i)DB.collection('issues').doc(String(i.id)).set(i).catch(wf);return}try{localStorage.setItem('s5iss1',JSON.stringify(ISS))}catch(e){}};
let FL={l:'all',st:'all'};
let PH={};
const DC={},KC={},DRV='Google Drive',FOLDER='1VLHszyVtlspScnkkvLIzWO8Hmz6tKsJp';let MC=null;
const imgSrc=v=>!v?'':String(v).startsWith('data:')?v:String(v).startsWith('d:')?(DC[v.slice(2)]||''):'/_blob/'+v;
const dlink=v=>v&&String(v).startsWith('d:')?'https://drive.google.com/file/d/'+v.slice(2)+'/view':'';
const objOf=r=>{let o=r&&(r.structuredContent||r.payload);if(o&&typeof o=='object'&&!Array.isArray(o)&&Object.keys(o).length)return o;const t=((r&&r.content)||[]).find(c=>c.type=='text');try{return JSON.parse(t.text)}catch(e){return{}}};
async function getMc(){if(!MC){try{MC=await mcpGet()}catch(e){MC=null}}return MC}
async function dargs(m,tool,o){if(!KC[tool]){try{const d=await m.describeTool(DRV,tool);KC[tool]=Object.keys((d.inputSchema&&d.inputSchema.properties)||{})}catch(e){KC[tool]=[]}}
if(!KC[tool].some(p=>p.includes('_')))return o;const r={};for(const k in o)r[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())]=o[k];return r}
async function driveUp(blob,k){const m=await getMc();if(!m)throw new Error('ไม่มีตัวเชื่อม Drive');const du=await b2d(blob);
const a=await dargs(m,'create_file',{title:'5S-'+Date.now()+'-'+k+'.jpg',base64Content:du.split(',')[1],contentMimeType:'image/jpeg',disableConversionToGoogleType:true,parentId:FOLDER});
const o=objOf(await m.callTool(DRV,'create_file',a));if(!o.id)throw new Error('Drive ไม่ส่งรหัสไฟล์กลับมา');DC[o.id]=du;return o.id}
async function viewPh(id,btn){if(DC[id]){zoom(DC[id]);return}const t=btn?btn.textContent:'';if(btn)btn.textContent='กำลังโหลด...';
try{const m=await getMc();if(!m)throw new Error('ไม่มีตัวเชื่อม Drive');const a=await dargs(m,'download_file_content',{fileId:id});const o=objOf(await m.callTool(DRV,'download_file_content',a));
if(!o.content)throw new Error('ไม่พบข้อมูลรูป');DC[id]='data:'+(o.mimeType||'image/jpeg')+';base64,'+o.content;zoom(DC[id])}catch(e){alert('เปิดรูปในหน้านี้ไม่ได้ ('+((e&&(e.code||e.message))||'?')+') ใช้ลิงก์ "เปิดใน Drive" แทน')}
if(btn)btn.textContent=t}
const photoHTML=(v,lb)=>!v?'':String(v).startsWith('d:')?`<div class="mu" style="margin-top:6px">📷 ${lb} <button class="btn" style="padding:2px 10px;font-size:12px" onclick="viewPh('${v.slice(2)}',this)">ดูรูป</button> <a href="${dlink(v)}" target="_blank" rel="noopener">เปิดใน Drive ↗</a></div>`:`<img class="ph" src="${imgSrc(v)}" alt="${lb}" onclick="zoom(this.src)">`;
const phHTML=k=>{const s=imgSrc(PH[k]);return s?`<img src="${s}" style="max-width:160px;max-height:120px;border-radius:8px;margin-top:6px">`:PH[k]?'<div class="mu">✓ แนบรูปแล้ว</div>':''};
function phUI(k){const v=PH[k],pv=document.getElementById('pv-'+k),bt=document.getElementById('bt-'+k),hn=document.getElementById('hn-'+k);
if(pv)pv.innerHTML=phHTML(k);if(bt)bt.disabled=!v;if(hn)hn.style.display=v?'none':'inline'}
function shrink(f,max,qual){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('แปลงรูปไม่สำเร็จ')),'image/jpeg',qual)};im.onerror=()=>no(new Error('ไฟล์ไม่ใช่รูปภาพ'));im.src=u})}
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function pickPh(k,inp){const f=inp.files[0];if(!f)return;const hn=document.getElementById('hn-'+k);
PH[k]=null;phUI(k);if(hn){hn.style.display='inline';hn.textContent='กำลังอัปโหลดรูป...'}

const SHD=['Line','Zone','Supervisor','TeamLeader','1S','2S','3S','4S','5S','Area%'],IH=['ID','Line','Zone','5S','Severity','Description','Auditor','DateFound','Due','Status','Reply','RepliedBy','Photo','ReplyPhoto'];
function scoreRows(){const r=[SHD];D.forEach((d,l)=>Z.forEach((z,zi)=>r.push([l+1,z,d.sup,d.tl[zi],...d.s[zi],+zp(l,zi).toFixed(1)])));return r}
function issueRows(){return [IH,...ISS.slice().sort((a,b)=>a.id-b.id).map(i=>[i.id,i.l+1,Z[i.z],(i.s+1)+'S',i.sev,i.desc,i.auditor||'',i.date,i.due,i.st,i.reply||'',i.by||'',dlink(i.img),dlink(i.rimg)])]}
const q=v=>{v=String(v==null?'':v);return /[",\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toText=(rows,sep)=>rows.map(r=>r.map(sep=='\t'?v=>String(v==null?'':v).replace(/[\t\r\n]/g,' '):q).join(sep)).join('\n');
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const sep=(t.split('\n')[0]||'').includes('\t')?'\t':',';const rows=[];let r=[],c='',inq=false;
for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}
else if(ch=='"')inq=true;else if(ch==sep){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
const nz=x=>String(x||'').trim().toLowerCase();
const zIdx=v=>{const n=nz(v);let k=Z.findIndex(z=>nz(z)==n);if(k<0&&/^[1-4]$/.test(n))k=+n-1;return k};
const lIdx=v=>{const m=String(v||'').match(/\d+/);const k=m?+m[0]-1:-1;return k>=0&&k<N?k:-1};
function readTable(text){const rows=parseCSV(text);if(rows.length<2)return null;const h=rows[0].map(nz);return{h,rows:rows.slice(1),col:n=>h.indexOf(nz(n))}}
function impScores(text){const T=readTable(text);if(!T)return 'ไม่พบข้อมูล (ต้องมีหัวตารางและอย่างน้อย 1 แถว)';
const cl=T.col('line'),cz=T.col('zone');if(cl<0||cz<0)return 'ไม่พบคอลัมน์ Line และ Zone';
const cs=['1s','2s','3s','4s','5s'].map(T.col),csup=T.col('supervisor'),ctl=T.col('teamleader');let n=0;const bad=[],ch=new Set();
T.rows.forEach((r,ri)=>{const l=lIdx(r[cl]),z=zIdx(r[cz]);if(l<0||z<0){bad.push('แถว '+(ri+2)+': ไลน์/พื้นที่ไม่ถูกต้อง');return}
cs.forEach((c,si)=>{if(c>=0&&String(r[c]).trim()!==''&&!isNaN(+r[c]))D[l].s[z][si]=Math.max(0,Math.min(100,Math.round(+r[c])))});
if(csup>=0&&r[csup].trim())D[l].sup=r[csup].trim();if(ctl>=0&&r[ctl].trim())D[l].tl[z]=r[ctl].trim();ch.add(l);n++});
ch.forEach(l=>save(l));return 'นำเข้าคะแนน '+n+' แถว อัปเดต '+ch.size+' ไลน์'+(bad.length?' · ข้าม '+bad.length+' แถว ('+bad.slice(0,4).join('; ')+')':'')}
const stMap={open:'open',replied:'replied',closed:'closed','รอตอบ':'open','ตอบแล้ว':'replied','ปิดแล้ว':'closed','ปิด':'closed'},svMap={high:'สูง',medium:'กลาง',low:'ต่ำ','สูง':'สูง','กลาง':'กลาง','ต่ำ':'ต่ำ'};
function impIssues(text){const T=readTable(text);if(!T)return 'ไม่พบข้อมูล (ต้องมีหัวตารางและอย่างน้อย 1 แถว)';
const c=n=>T.col(n),g=(r,n)=>c(n)>=0?String(r[c(n)]||'').trim():'';let add=0,upd=0;const bad=[];
T.rows.forEach((r,ri)=>{const l=lIdx(g(r,'line')),z=zIdx(g(r,'zone')),d=g(r,'description');if(l<0||z<0||!d){bad.push('แถว '+(ri+2));return}
let id=parseInt(g(r,'id'));const ex=id?ISS.find(x=>x.id==id):null;if(!id)id=Math.max(0,...ISS.map(i=>i.id))+1;
const sm=g(r,'5s').match(/[1-5]/);
const o={id,l,z,s:sm?+sm[0]-1:0,sev:svMap[nz(g(r,'severity'))]||'กลาง',desc:d,auditor:g(r,'auditor'),date:g(r,'datefound')||todayS(),due:g(r,'due')||addD(7),st:stMap[nz(g(r,'status'))]||'open',reply:g(r,'reply')};
const by=g(r,'repliedby');if(by)o.by=by;const gid=u=>{const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?'d:'+m[1]:''};const g1=gid(g(r,'photo')),g2=gid(g(r,'replyphoto'));if(g1)o.img=g1;if(g2)o.rimg=g2;
if(ex){Object.assign(ex,o);saveI(ex);upd++}else{ISS.push(o);saveI(o);add++}});
return 'นำเข้า Issue: เพิ่มใหม่ '+add+' · อัปเดต '+upd+(bad.length?' · ข้าม '+bad.length+' แถว ('+bad.slice(0,5).join(', ')+')':'')}

async function apiCall(o,post){const q=Object.assign({},o,{token:API.t});let r;
try{r=post?await fetch(API.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q)}):await fetch(API.u+'?'+new URLSearchParams(q))}catch(e){throw{code:'network',message:'เชื่อมต่อ Apps Script ไม่ได้ (ตรวจ URL และการ Deploy แบบ Anyone)'}}
if(!r.ok)throw{code:'http_'+r.status,message:'HTTP '+r.status};let j;try{j=await r.json()}catch(e){throw{code:'bad_response',message:'Apps Script ตอบกลับไม่ใช่ JSON (ตรวจว่า Deploy เป็น Web app และเข้าถึงได้แบบ Anyone)'}}
if(j.error)throw{code:j.error,message:j.error};return j}
const tabOf=a=>String(a.range||'').split('!')[0];
const APIMC={async callTool(srv,tool,a){a=a||{};
if(tool=='get_values'){const j=await apiCall({action:'read',tab:tabOf(a)});return{structuredContent:{values:j.values||[]},content:[]}}
if(tool=='update_values'){await apiCall({action:'write',tab:tabOf(a),values:a.values},true);return{structuredContent:{status:'success'},content:[]}}
if(tool=='create_file'){const j=await apiCall({action:'upload',name:a.title,mime:a.contentMimeType,b64:a.base64Content},true);return{structuredContent:{id:j.id},content:[]}}
if(tool=='download_file_content'){const j=await apiCall({action:'photo',id:a.fileId},true);return{structuredContent:{content:j.content,mimeType:j.mimeType},content:[]}}
throw{code:'bad_request',message:tool}},
watchTool(srv,tool,inp,h,o){let on=true;const run=async()=>{if(!on)return;try{h({type:'data',result:await this.callTool(srv,tool,inp)})}catch(e){h({type:'error',error:e})}};run();const t=setInterval(run,(o&&o.refetchInterval)||30000);return()=>{on=false;clearInterval(t)}},
async invalidate(){},async describeTool(){throw{code:'bad_request'}},async listTools(){return{servers:[]}}};
async function mcpGet(){if(window.claude){try{const m=await claude.use('mcp');if(m)return m}catch(e){}}return API.u?APIMC:null}
function saveApi(){const u=document.getElementById('apiu').value.trim();
try{localStorage.setItem('s5api_u',u)}catch(e){}
MC=null;SY.mcp=null;SY.hs={sc:'',is:''};if(SY.on)syncOff();if(u)syncOn();else setSy('กรอก Web App URL')}
function who(){if(!ME){try{ME=localStorage.getItem('s5me')||''}catch(e){}if(!ME){ME=(prompt('ชื่อของคุณ (บันทึกเป็นผู้ตอบ)')||'').trim();try{localStorage.setItem('s5me',ME)}catch(e){}}}return ME}
const SID='1sbt8KSnrQ_bWRVSWQ66hv_aXEm7GGshoqxAoiQT5f6A',SRV='Google Sheets';
const SK={sc:{tab:'Scores',rng:'A1:J200',rows:()=>scoreRows()},is:{tab:'Issues',rng:'A1:N1000',rows:()=>issueRows()}};
let SY={on:false,st:'',mcp:null,keys:{},hs:{sc:'',is:''},at:{sc:0,is:0},unsub:[],t:null};
const nrm=rows=>JSON.stringify(rows.map(r=>{r=r.map(c=>String(c==null?'':c));while(r.length&&r[r.length-1]==='')r.pop();return r}).filter(r=>r.length));
function setSy(t){if(t!=null)SY.st=t;const e=document.getElementById('sy');if(e)e.textContent=SY.st;const b=document.getElementById('syb');if(b)b.textContent=SY.on?'ปิดซิงก์ Sheet':'เปิดซิงก์ Google Sheet'}
async function sargs(tool,o){if(!SY.keys[tool]){try{const d=await SY.mcp.describeTool(SRV,tool);SY.keys[tool]=Object.keys((d.inputSchema&&d.inputSchema.properties)||{})}catch(e){SY.keys[tool]=['spreadsheetId']}}
const sn=SY.keys[tool].includes('spreadsheet_id'),a=sn?{spreadsheet_id:SID,range:o.range}:{spreadsheetId:SID,range:o.range};if(o.values)a.values=o.values;return a}
function valsOf(res){const v=x=>x&&Array.isArray(x.values)?x.values:null;let a=v(res.structuredContent)||v(res.payload);
if(!a){const t=(res.content||[]).find(c=>c.type=='text');if(t){try{a=v(JSON.parse(t.text))}catch(e){}}}return a||[]}
const tnow=()=>new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const errT=e=>e&&(e.code=='not_in_manifest'||e.code=='not_granted'||e.code=='consent_required')?'ยังไม่ได้รับอนุญาตให้ใช้ Google Sheets กับหน้านี้ — กด "จัดการสิทธิ์" แล้วเปิดสิทธิ์ Google Sheets':e&&e.code=='needs_reauth'?'ต้องเชื่อมต่อ Google Sheets ใหม่':e&&e.code=='server_not_connected'?'ยังไม่ได้เชื่อมต่อ Google Sheets':'ซิงก์ผิดพลาด ('+((e&&(e.code||e.message))||'?')+')';
function schedPush(){if(!SY.on)return;clearTimeout(SY.t);SY.t=setTimeout(()=>{push('sc');push('is')},1500)}
async function push(k){if(!SY.on||!SY.mcp)return;const rows=SK[k].rows(),h=nrm(rows);if(h==SY.hs[k])return;
try{const a=await sargs('update_values',{range:SK[k].tab+'!A1:'+String.fromCharCode(64+rows[0].length)+rows.length,values:rows.map(r=>r.map(c=>c==null?'':c))});
await SY.mcp.callTool(SRV,'update_values',a);SY.hs[k]=h;SY.at[k]=Date.now();try{await SY.mcp.invalidate(SRV,'get_values')}catch(e){}setSy('ซิงก์ล่าสุด '+tnow()+' (ส่งขึ้น Sheet)')}catch(e){setSy(errT(e))}}
function onEv(k,ev){if(!SY.on)return;if(ev.type=='error'){setSy(errT(ev.error)+(ev.error&&ev.error.message?' · '+ev.error.message:''));showFix(ev.error);return}
if(Date.now()-SY.at[k]<8000)return;const vals=valsOf(ev.result);
if(vals.length<2){push(k);return}
const h=nrm(vals);if(h==SY.hs[k]){setSy('ซิงก์ล่าสุด '+tnow());return}
SY.hs[k]=h;const t=toText(vals,','),m=k=='sc'?impScores(t):impIssues(t);setSy('ซิงก์ล่าสุด '+tnow()+' (รับจาก Sheet) · '+m);
const bz=/^(TEXTAREA|INPUT|SELECT)$/.test((document.activeElement||{}).tagName);if(!bz)draw()}
async function syncOn(){try{SY.mcp=await mcpGet()}catch(e){}
if(!SY.mcp){setSy(window.claude?'โหมดนี้ใช้ซิงก์ Sheet ไม่ได้':'ยังไม่ได้ตั้งค่า Apps Script — ไปที่แท็บ Export / Import Sheet ข้อ 0');return}
SY.on=true;try{localStorage.setItem('s5sync','1')}catch(e){}setSy('กำลังเชื่อมต่อ...');
try{const pm=await claude.use('permissions');if(pm){const st=await pm.state('mcp:'+SRV);if(st=='prompt')await pm.request(['mcp:'+SRV])}}catch(e){}
try{for(const k of ['sc','is']){const a=await sargs('get_values',{range:SK[k].tab+'!'+SK[k].rng});
SY.unsub.push(SY.mcp.watchTool(SRV,'get_values',a,ev=>onEv(k,ev),{cache:{staleTime:5000},refetchInterval:30000}))}}catch(e){SY.on=false;setSy(errT(e)+(e&&e.message?' · '+e.message:''));showFix(e)}}
async function showFix(e){const b=document.getElementById('syf');if(b)b.style.display=e&&(e.code=='not_in_manifest'||e.code=='not_granted'||e.code=='consent_required')?'inline-block':'none';
if(e&&e.code=='not_in_manifest'&&SY.mcp){try{const l=await SY.mcp.listTools();setSy(SY.st+' · connector ที่เห็น: '+(l.servers.map(x=>x.server).join(', ')||'ไม่มี'))}catch(x){}}}
function syncOff(){SY.on=false;SY.unsub.forEach(f=>{try{f()}catch(e){}});SY.unsub=[];try{localStorage.removeItem('s5sync')}catch(e){}setSy('ปิดซิงก์แล้ว')}
async function permFix(){try{const pm=await claude.use('permissions');if(pm)await pm.manage()}catch(e){}}
function toggleSync(){SY.on?syncOff():syncOn()}
try{if(!window.claude||localStorage.getItem('s5sync')=='1')setTimeout(syncOn,1500)}catch(e){}

draw();setSy();
</script></body></html>
