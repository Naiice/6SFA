function shrink(f,max,qual){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('แปลงรูปไม่สำเร็จ')),'image/jpeg',qual)};im.onerror=()=>no(new Error('ไฟล์ไม่ใช่รูปภาพ'));im.src=u})}
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function pickPh(k,inp){const f=inp.files[0];if(!f)return;const hn=document.getElementById('hn-'+k);
PH[k]=null;phUI(k);if(hn){hn.style.display='inline';hn.textContent='กำลังอัปโหลดรูป...'}
let why='';
try{let v=null;
try{const id=await driveUp(await shrink(f,1280,.75),k);v='d:'+id}catch(e){why='Drive: '+((e&&(e.code||e.message))||'?')}
if(!v){let as=null;try{as=window.claude?await claude.use('assets'):null}catch(e){}
if(as){try{v=(await as.upload(await shrink(f,1280,.75))).id}catch(e){why+=' / assets: '+((e&&(e.code||e.message))||'?')}}}
if(!v){let b;for(const [m,q] of [[900,.6],[700,.55],[560,.5],[420,.45]]){b=await shrink(f,m,q);if(b.size<=90000)break}v=await b2d(b)}
PH[k]=v;if(v.startsWith('d:'))why=''}catch(e){alert('แนบรูปไม่สำเร็จ: '+(e.message||'ไฟล์ไม่ถูกต้อง'))}
if(hn)hn.textContent='ต้องแนบรูปก่อนจึงจะ'+(k=='add'?'บันทึก':'ส่งคำตอบ')+'ได้';phUI(k);
const pv=document.getElementById('pv-'+k);if(pv&&PH[k]){pv.insertAdjacentHTML('beforeend','<div class="mu">'+(why?'⚠ เก็บใน Dashboard แทน Drive ('+esc(why)+')':'☁ บันทึกลง Google Drive แล้ว')+'</div>')}}
function zoom(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out';const im=document.createElement('img');im.src=src;im.style.cssText='max-width:95%;max-height:95%';d.appendChild(im);d.onclick=()=>d.remove();document.body.appendChild(d)}

const late=i=>i.st!='closed'&&i.due<todayS();
function ist(l,z){const u=l==null?null:D[l];const a=ISS.filter(i=>(l==null||inU(i,u))&&(z==null||i.z==z));const c=a.filter(i=>i.st=='closed').length;
return{t:a.length,c,r:a.filter(i=>i.st!='open').length,od:a.filter(late).length,p:a.length?c/a.length*100:null}}

const stT={open:'รอตอบ',replied:'ตอบแล้ว รอ Audit ยืนยัน',closed:'ปิดแล้ว'};
const shortText=(t,n=90)=>{t=String(t||'');return t.length>n?t.slice(0,n-1)+'…':t};
const sevW=s=>s=='สูง'?3:s=='กลาง'?2:1;
function lineRanking(){return D.map((d,l)=>({l,p:lp(l),sup:d.sup,t:ist(l)})).filter(x=>x.p!=null).sort((a,b)=>b.p-a.p||a.t.od-b.t.od)}
function criticalIssues(n=5){return ISS.filter(i=>i.st!='closed').slice().sort((a,b)=>(late(b)?1:0)-(late(a)?1:0)||sevW(b.sev)-sevW(a.sev)||String(a.due||'9999').localeCompare(String(b.due||'9999'))).slice(0,n)}

function issueTrend(days=14){const dates=[],found=[],due=[];const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(days-1));for(let k=0;k<days;k++){const x=new Date(d);x.setDate(d.getDate()+k);const key=x.toISOString().slice(0,10);dates.push(key);found.push(ISS.filter(i=>i.date==key).length);due.push(ISS.filter(i=>i.due==key&&i.st!='closed').length)}return{dates,found,due}}
function trendChart(T){const W=720,H=245,L=36,R=12,Tp=18,B=36,iw=W-L-R,ih=H-Tp-B,max=Math.max(1,...T.found,...T.due),x=i=>L+(T.dates.length<2?0:i*iw/(T.dates.length-1)),y=v=>Tp+ih-(v/max)*ih,pts=a=>a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' '),area=`${L},${Tp+ih} ${pts(T.found)} ${x(T.dates.length-1)},${Tp+ih}`;let g='';for(let j=0;j<=4;j++){const yy=Tp+ih*j/4,val=Math.round(max*(1-j/4));g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" class="chart-grid"/><text x="4" y="${yy+3}" class="chart-label">${val}</text>`}const labs=T.dates.map((d,i)=>i%3==0||i==T.dates.length-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" class="chart-label">${d.slice(5)}</text>`:'').join('');const dots=T.found.map((v,i)=>v?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" class="chart-dot-a"><title>${T.dates[i]} · Found ${v}</title></circle>`:'').join('')+T.due.map((v,i)=>v?`<circle cx="${x(i)}" cy="${y(v)}" r="3" class="chart-dot-b"><title>${T.dates[i]} · Due ${v}</title></circle>`:'').join('');return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="areaBlue" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#5d72e9" stop-opacity=".55"/><stop offset="100%" stop-color="#5d72e9" stop-opacity="0"/></linearGradient></defs>${g}<polygon points="${area}" class="chart-area-a"/><polyline points="${pts(T.found)}" class="chart-line-a"/><polyline points="${pts(T.due)}" class="chart-line-b"/>${dots}${labs}</svg></div>`}
function statusDonut(o,r,c){const total=o+r+c,a=total?o/total*100:0,b=total?r/total*100:0;return `<div class="donut-layout"><div class="donut" style="--a:${a};--b:${b}"><div class="donut-center"><b>${total}</b><span>Total Issues</span></div></div><div class="donut-legend"><div class="donut-item"><span class="left"><span class="dot open"></span>รอตอบ</span><b>${o}</b></div><div class="donut-item"><span class="left"><span class="dot replied"></span>รอ Audit ยืนยัน</span><b>${r}</b></div><div class="donut-item"><span class="left"><span class="dot closed"></span>ปิดแล้ว</span><b>${c}</b></div><div class="mu" style="margin-top:4px">Closure ${total?(c/total*100).toFixed(1):0}%</div></div></div>`}

const DEL_HASH='74cf43e9bfa9d9c486cc921ae9381bb88498b414f6e3b968b1606e705eacbc2b';
const sha=async t=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')};
function askPw(msg){return new Promise(ok=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99';

document.body.appendChild(d);const i=d.querySelector('#pwi');i.focus();const done=v=>{d.remove();ok(v)};
d.querySelector('#pwo').onclick=()=>done(i.value);d.querySelector('#pwc').onclick=()=>done(null);i.onkeydown=e=>{if(e.key=='Enter')done(i.value);if(e.key=='Escape')done(null)}})}

const pw=await askPw('กรอกรหัสเพื่อลบ Issue #'+id);if(pw==null)return;
let okp=false;try{okp=(await sha(pw))===DEL_HASH}catch(e){alert('เบราว์เซอร์นี้ตรวจรหัสไม่ได้ (ต้องเปิดผ่าน https)');return}
if(!okp){alert('รหัสไม่ถูกต้อง');return}
if(!confirm('ลบ Issue #'+id+' ('+lnI(i)+' · '+Z[i.z]+') ?\nแถวนี้ใน Google Sheet จะถูกลบด้วย และกู้คืนไม่ได้'))return;
ISS=ISS.filter(x=>x.id!=id);
if(DB){try{DB.collection('issues').doc(String(id)).delete().catch(wf)}catch(e){wf(e)}}
saveI();SY.dirty.is=1;if(SY.on)schedPush('is');else alert('ยังไม่ได้เปิดซิงก์ Sheet จึงลบเฉพาะในเครื่องนี้ (แถวใน Sheet ยังอยู่)');draw()}

try{const pm=await claude.use('permissions');if(pm){const st=await pm.state('mcp:'+SRV);if(st=='prompt')await pm.request(['mcp:'+SRV])}}catch(e){}
try{for(const k of ['sc','is']){const a=await sargs('get_values',{range:SK[k].tab+'!'+SK[k].rng});
SY.unsub.push(SY.mcp.watchTool(SRV,'get_values',a,ev=>onEv(k,ev),{cache:{staleTime:5000},refetchInterval:30000}))}}catch(e){SY.on=false;setSy(errT(e)+(e&&e.message?' · '+e.message:''));showFix(e)}}
async function showFix(e){const b=document.getElementById('syf');if(b)b.style.display=e&&(e.code=='not_in_manifest'||e.code=='not_granted'||e.code=='consent_required')?'inline-block':'none';
if(e&&e.code=='not_in_manifest'&&SY.mcp){try{const l=await SY.mcp.listTools();setSy(SY.st+' · connector ที่เห็น: '+(l.servers.map(x=>x.server).join(', ')||'ไม่มี'))}catch(x){}}}
function syncOff(){SY.on=false;SY.unsub.forEach(f=>{try{f()}catch(e){}});SY.unsub=[];try{localStorage.removeItem('s5sync')}catch(e){}setSy('ปิดซิงก์แล้ว')}
async function permFix(){try{const pm=await claude.use('permissions');if(pm)await pm.manage()}catch(e){}}
function toggleSync(){SY.on?syncOff():syncOn()}
try{if(!window.claude||localStorage.getItem('s5sync')=='1')setTimeout(syncOn,1500)}catch(e){}

draw();setSy();
</script></body></html>
